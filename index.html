<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="多语言服务用语学习工具 — 工作前快速复习礼貌表达">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="服务用语">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>服务用语学习</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>服务用语学习</h1>
      <p>固定短句 · 工作前快速复习</p>
    </header>

    <div class="controls">
      <div class="field">
        <label for="phraseSelect">中文句式</label>
        <select id="phraseSelect">
          <option value="">— 请选择 —</option>
        </select>
      </div>
      <div class="field">
        <label for="langSelect">语言</label>
        <select id="langSelect">
          <option value="">— 请选择 —</option>
        </select>
      </div>
    </div>

    <p class="placeholder" id="placeholder">请选择中文句式和语言，开始学习</p>

    <article class="card" id="card" aria-live="polite">
      <div class="card-main">
        <span class="card-lang-badge" id="langBadge"></span>
        <p class="card-original" id="original"></p>
        <p class="card-meaning" id="meaning"></p>

        <div class="pronunciation-grid">
          <div class="pron-block">
            <div class="pron-label">IPA</div>
            <div class="pron-value ipa" id="ipa"></div>
          </div>
          <div class="pron-block">
            <div class="pron-label">片假名</div>
            <div class="pron-value katakana" id="katakana"></div>
          </div>
          <div class="pron-block full-width">
            <div class="pron-label">罗马字 / 转写</div>
            <div class="pron-value" id="romanization"></div>
          </div>
        </div>

        <button class="btn-speak" id="speakBtn" type="button" aria-label="播放发音">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          发音
        </button>
      </div>

      <div class="card-extra">
        <div class="extra-section">
          <div class="extra-title">使用场景</div>
          <div class="extra-body" id="scenario"></div>
        </div>
        <div class="extra-section">
          <div class="extra-title">相关知识</div>
          <div class="extra-body" id="knowledge"></div>
        </div>
        <div class="extra-section">
          <div class="extra-title">衍生用语</div>
          <ul class="derived-list" id="derived"></ul>
        </div>
      </div>
    </article>
  </div>

  <script src="data.js"></script>
  <script src="app.js?v=20260803-1"></script>
</body>
</html>
